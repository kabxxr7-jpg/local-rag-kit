[pytest]
pythonpath = .
testpaths = tests
addopts = -m "not live" -p no:cacheprovider
markers =
    scenarios: runs every offline scenario of the inherited-pipeline lab (about a minute; the mutation check leaves these out)
    live: needs the real Ollama server at http://127.0.0.1:11434 with llama3.2:1b and nomic-embed-text (run with: pytest -m live)
